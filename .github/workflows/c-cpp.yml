name: C/C++ Build & Syntax Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Compile C Files Individually
        run: |
          find . -name "*.c" | while read file; do
            echo "Compiling $file"
            gcc "$file" -o /tmp/$(basename "$file" .c)
          done

      - name: Compile C++ Files Individually
        run: |
          find . -name "*.cpp" | while read file; do
            echo "Compiling $file"
            g++ "$file" -o /tmp/$(basename "$file" .cpp)
          done
